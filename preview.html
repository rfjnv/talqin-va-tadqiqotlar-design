<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>TVT logo preview</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="svg/favicon.svg" type="image/svg+xml">
<style>
body{margin:0;font:13px/1.4 system-ui,sans-serif;background:#e9e6de;color:#292929}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px;padding:12px}
.c{display:flex;align-items:center;justify-content:center;gap:28px;min-height:280px;padding:40px;position:relative}
.c span{position:absolute;left:12px;bottom:8px;opacity:.6;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.iv{background:#F4F2EC}.nv{background:#0F2D44;color:#F4F2EC}
img{max-width:100%}
.px{image-rendering:pixelated}
.fav{align-items:flex-end}
</style></head><body>
<div class="grid">
 <div class="c iv"><img src="svg/tvt-logo-stacked-navy.svg" width="560"><span>stacked · navy</span></div>
 <div class="c nv"><img src="svg/tvt-logo-stacked-ivory.svg" width="560"><span>stacked · ivory</span></div>
 <div class="c iv"><img src="svg/tvt-logo-horizontal-navy.svg" width="560"><span>horizontal · header</span></div>
 <div class="c nv"><img src="svg/tvt-logo-horizontal-ivory.svg" width="560"><span>horizontal · ivory</span></div>
 <div class="c iv"><img src="svg/tvt-monogram-navy.svg" width="300"><span>monogram · navy</span></div>
 <div class="c iv"><img src="svg/tvt-monogram-gold.svg" width="300"><span>monogram · gold</span></div>
 <div class="c iv fav">
   <img src="png/apple-touch-icon.png" width="180" style="border-radius:40px">
   <img src="png/icon-192.png" width="96">
   <span>app icon · 180 / 96</span></div>
 <div class="c iv fav">
   <img src="png/favicon-48.png" width="48"><img src="png/favicon-32.png" width="32"><img src="png/favicon-16.png" width="16">
   <img class="px" src="png/favicon-32.png" width="128"><img class="px" src="png/favicon-16.png" width="128">
   <span>favicon 48/32/16 real size · 32 & 16 magnified</span></div>
</div>
</body></html>
